# Installed as /etc/tmpfiles.d/firecracker-vms.conf with @CLIENT_GROUP@ rendered to
# the unprivileged vmapi user's primary group. /run is a tmpfs,
# so this recreates the trusted runtime tree at every boot.
#
# Trust layout (vmapi verifies it at start and refuses to run otherwise):
#   /run/firecracker-vms              root:root  0755  - NOT writable by vmapi, so vmapi
#                                                      cannot replace slot directories
#                                                      or plant exit receipts
#   /run/firecracker-vms/.backend.lock root:@CLIENT_GROUP@ 0660  - the ONLY writable
#                                                      object; vmapi opens it, never creates it
#   /run/firecracker-vms/slot-N       root:@CLIENT_GROUP@ 0750 (made by systemd from
#                                                      RuntimeDirectory= in the VMM unit)
#   slot-N/<invocation>.exit.json     root, 0640 (written by the launcher's ExecStopPost)
#
# Type Path                                  Mode  User Group           Age Argument
d     /run/firecracker-vms                   0755  root root            -
f     /run/firecracker-vms/.backend.lock     0660  root @CLIENT_GROUP@  -
