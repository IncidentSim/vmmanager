openapi: 3.0.3
info:
  title: vmapi control API
  version: "1"
  description: >
    Authenticated VM control API (see control-api.md). Mutations are asynchronous:
    they return 202 with an operation to poll. Foreign and unknown IDs return an
    identical 404. A user bearer is bound to one user; a service bearer must send
    X-Acting-User-ID.


    **Authorization (Telegram users).** Send `/token` to the bot in a private chat
    to receive a personal RS256 JWT (valid 28800 seconds = 8 hours; send `/token`
    again to renew). Press Authorize and paste the token only (no `Bearer `
    prefix). The owner is the immutable numeric Telegram ID in the signed `sub`
    claim; the optional signed `tg_username` claim only bootstraps a configured
    username slot, which the API pins permanently to that ID. A user token never
    selects another user: `X-Acting-User-ID` is refused for it.
servers:
  - url: /
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 user token issued by the bot (claims iss, aud, sub, iat, nbf, exp and
        optional tg_username; 28800 seconds by default), verified by the API with
        its public key only. Static service/user bearers remain supported for
        compatibility where configured.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string}
    idempotency:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-128 printable ASCII characters without spaces; scoped to the principal.
      schema: {type: string, minLength: 1, maxLength: 128}
    acting:
      name: X-Acting-User-ID
      in: header
      required: false
      description: Required (canonical positive decimal) for service credentials; forbidden for user credentials.
      schema: {type: string, pattern: "^[1-9][0-9]*$"}
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [validation_failed, profile_unknown, vm_expired, key_not_generated, method_not_allowed, not_implemented, not_found, unauthorized, forbidden, invalid_argument, conflict, capacity, unavailable, internal]
            message: {type: string}
            fields:
              type: array
              items:
                type: object
                required: [field, code, message]
                properties:
                  field: {type: string}
                  code: {type: string}
                  message: {type: string}
    Resources:
      type: object
      nullable: true
      required: [vcpu, cpu_limit, memory_mib]
      properties:
        vcpu: {type: integer, minimum: 1}
        cpu_limit: {type: number, minimum: 0.01, multipleOf: 0.01, description: 'CPU-time quota in CPU units, separate from guest vCPU count.'}
        memory_mib: {type: integer, minimum: 1}
    VM:
      type: object
      required: [id, name, image_id, state, phase, resources]
      properties:
        id: {type: string}
        name: {type: string}
        image_id: {type: string}
        state: {type: string}
        phase:
          type: string
          enum: [creating, active, stopping, stopped, committing, committed, deleting]
        resources: {$ref: "#/components/schemas/Resources"}
        profile: {type: string}
        ttl_seconds: {type: integer}
        expires_at: {type: string, format: date-time}
        owner_error:
          type: boolean
          description: >-
            Additive; present (true) only when the VM's durable owner workflow ended
            abnormally. The VM and its quota slot are retained and new commands for it
            return 503. `phase` is the lifecycle applied by the owner; accepting a
            request never changes it.
    CreateVM:
      # Deployment inserts a configured bootable image and profile, never a fake SSH key.
      type: object
      additionalProperties: false
      required: [image_id]
      properties:
        name:
          type: string
          minLength: 0
          maxLength: 20
          pattern: '^(?!bot-)([a-z]([a-z0-9-]{0,18}[a-z0-9])?)?$'
          description: Optional label, unique per owner. Non-empty labels use 1-20 characters - lowercase ASCII letters, digits and inner hyphens, starting with a letter, ending with a letter or digit, not starting with `bot-`. Matched exactly (no trimming or case folding). Omit it or send an empty string to leave the VM unnamed.
        image_id: {type: string}
        profile: {type: string, description: "Profile from capabilities; defaults to default_profile."}
        ttl_seconds: {type: integer, minimum: 1, description: "Available only when capabilities advertises ttl; defaults and maximum come from that policy."}
        ssh_public_key:
          type: string
          description: A genuine single OpenSSH public key without options. Accepted only when capabilities advertises supplied-key provisioning.
    Name:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^(?!bot-)[a-z]([a-z0-9-]{0,18}[a-z0-9])?$'
          description: Required, globally unused image name. Same format as a VM name - 1-20 characters, lowercase ASCII letters, digits and inner hyphens, starting with a letter, ending with a letter or digit, not starting with `bot-`. Matched exactly (no trimming or case folding).
    Empty:
      type: object
      additionalProperties: false
    Accepted:
      type: object
      required: [operation_id]
      properties:
        operation_id: {type: string}
        vm_id: {type: string}
        image_id: {type: string}
    Image:
      type: object
      required: [id, name, shared, phase, can_delete]
      properties:
        id: {type: string}
        name: {type: string}
        shared: {type: boolean, description: "True for every catalog image: the registry is common to all admitted users."}
        phase:
          type: string
          enum: [ready, deleting]
          description: "A deleting image is listed only to its creator and is not bootable."
        can_delete: {type: boolean, description: "Permission only (caller is the creator and the image is not a system image); delete may still return 409 while any VM references it."}
    SSH:
      type: object
      required: [host, port, user, host_key_fingerprint, ready]
      properties:
        host: {type: string}
        port: {type: integer}
        user: {type: string}
        bastion:
          type: object
          properties:
            host: {type: string}
            port: {type: integer}
            user: {type: string}
        host_key_fingerprint: {type: string}
        ready:
          type: boolean
          description: >-
            Fresh TCP reachability from the API host to host:port, not SSH
            authentication, host-key verification, bastion connectivity or
            off-host client reachability. True only for an active API VM whose
            live backend state is running before and after one successful TCP
            probe. The complete readiness observation is bounded to one second
            and by the remaining query/request deadline; it never waits for boot.
            False for missing endpoint data, unavailable/stopped backend state,
            non-active phases (including stopping/deleting), connection failure
            or timeout. Metadata remains available with ready=false.
        auth_mode: {type: string}
        key_reference: {type: string}
        browser_url:
          type: string
          description: Nexterm ordinary-user bearer session link, present only when browser_status is ready. Never log it.
        browser_status:
          type: string
          enum: [ready, pending, unsupported]
          description: Present only with API Nexterm enabled. Pending or unsupported has no browser_url; raw SSH is unchanged and there is no ttyd fallback.
    Operation:
      type: object
      required: [id, status, kind]
      properties:
        id: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed]}
        kind: {type: string}
        vm_id: {type: string}
        image_id: {type: string}
        result:
          type: object
          description: >
            For a succeeded terminal operation, url grants bearer access.
            With Nexterm enabled, browser_status is ready, pending or unsupported;
            url is present only when ready and equals the SSH endpoint browser_url.
            Pending/unsupported never fall back to ttyd. Poll again to retry.
          properties:
            url: {type: string}
            browser_status: {type: string, enum: [ready, pending, unsupported]}
        error:
          type: object
          properties:
            code: {type: string, enum: [unavailable, conflict, capacity, invalid_argument]}
            message: {type: string}
paths:
  /healthz:
    get:
      security: []
      summary: Unauthenticated minimal health.
      responses:
        "200":
          description: ok or degraded (startup repair incomplete; API still serving).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, degraded]}
  /v1/capabilities:
    get:
      parameters: [{$ref: "#/components/parameters/acting"}]
      responses:
        "200":
          description: API quotas and live resource policy forwarded from the backend facade.
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_vms: {type: integer}
                  max_vms_per_user: {type: integer}
                  backend_max_vms: {type: integer}
                  max_total_memory_mib:
                    type: integer
                    description: Omitted when no aggregate memory cap is advertised.
                  max_total_cpu_limit:
                    type: number
                    description: Aggregate CPU-time quota in CPU units; omitted when not advertised.
                  max_total_vcpu:
                    type: integer
                    description: Omitted when no aggregate CPU cap is advertised.
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [name, vcpu, cpu_limit, memory_mib, disk_mib]
                      properties:
                        name: {type: string}
                        vcpu: {type: integer}
                        cpu_limit: {type: number}
                        memory_mib: {type: integer}
                        disk_mib: {type: integer}
                  default_profile: {type: string}
                  ssh_public_key_supported: {type: boolean}
                  ssh_generated_key_supported: {type: boolean}
                  ttl:
                    type: object
                    description: Omitted until durable expiry is enabled.
                    properties:
                      default_seconds: {type: integer}
                      max_seconds: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms:
    get:
      parameters: [{$ref: "#/components/parameters/acting"}]
      responses:
        "200":
          description: Caller's VMs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vms: {type: array, items: {$ref: "#/components/schemas/VM"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      parameters: [{$ref: "#/components/parameters/acting"}, {$ref: "#/components/parameters/idempotency"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateVM"}
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}]
    get:
      responses:
        "200":
          description: VM.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VM"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      parameters: [{$ref: "#/components/parameters/idempotency"}]
      summary: Sequential delete. Accepted while another command runs, but executed only after it (and nothing admitted before it) has finished; never preempts and does not revoke access at acceptance.
      responses:
        "202":
          description: Accepted (durably delivered to the VM's owner; not yet processed).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}/stop:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}, {$ref: "#/components/parameters/idempotency"}]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}/commit:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}, {$ref: "#/components/parameters/idempotency"}]
    post:
      summary: Cold commit into a new common-registry image (name must be globally unused); the source VM stays stopped, occupied and private.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Name"}
      responses:
        "202":
          description: Accepted (includes the new image_id).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}/terminal:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}, {$ref: "#/components/parameters/idempotency"}]
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Empty"}
      responses:
        "202":
          description: Accepted; read the URL from the operation result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}/ssh-key:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}]
    get:
      summary: Retrieve generated private key (owner-only, no-store).
      description: Never includes supplied-key credentials. Returns 409 key_not_generated for supplied keys, 501 when unavailable; foreign and missing IDs are identical 404.
      responses:
        "200":
          description: Sensitive generated key; never log or retain in workflow history.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                type: object
                required: [vm_id, public_key, private_key]
                properties:
                  vm_id: {type: string}
                  public_key: {type: string}
                  private_key: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /v1/vms/{id}/ssh:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}]
    get:
      description: >-
        Owner-only SSH metadata with a bounded live readiness observation.
        Ownership is checked before metadata/backend access or any network probe.
        A not-yet-ready guest still returns 200 with ready=false when metadata
        is available. Metadata lookup failure uses the normal error envelope.
        The whole read honors request cancellation and the controller query
        timeout (default 20 seconds); readiness gets at most one second of that
        budget and does not poll until SSH starts.
      responses:
        "200":
          description: Public connection metadata and current host-side TCP readiness.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SSH"}
        default: {$ref: "#/components/responses/Error"}
  /v1/images:
    get:
      parameters: [{$ref: "#/components/parameters/acting"}]
      responses:
        "200":
          description: Common registry - configured system images plus every ready committed image, and the caller's own deleting images.
          content:
            application/json:
              schema:
                type: object
                properties:
                  images: {type: array, items: {$ref: "#/components/schemas/Image"}}
        default: {$ref: "#/components/responses/Error"}
  /v1/images/{id}:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}]
    get:
      responses:
        "200":
          description: Image.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Image"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      parameters: [{$ref: "#/components/parameters/idempotency"}]
      summary: Creator-only. Refused 403 for another user's image, 409 for system base images and images referenced by any VM (any owner).
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Accepted"}
        default: {$ref: "#/components/responses/Error"}
  /v1/operations/{id}:
    parameters: [{$ref: "#/components/parameters/id"}, {$ref: "#/components/parameters/acting"}]
    get:
      responses:
        "200":
          description: Operation state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Operation"}
        default: {$ref: "#/components/responses/Error"}
