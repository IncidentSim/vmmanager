# PROPOSED ONLY: /etc/systemd/system/firecracker-vm@.service.d/resources.conf
# Move only future idle slots to a separately approved budget; never move live VMMs.
[Service]
Slice=firecracker-vms.slice
CPUAccounting=yes
# Fail-safe baseline. The helper sets and verifies each persisted VM quota.
CPUQuota=50%
MemoryMax=768M
