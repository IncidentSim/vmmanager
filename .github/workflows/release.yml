name: release

# Publishes a GitHub Release when a version tag is pushed. Nothing is published
# for branches or pull requests (those only run the snapshot build in ci.yml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.1.0)
        required: true
        type: string
  push:
    tags: ["v*"]

# Only this job needs write access, to create the release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Private test scratch (credential ancestry must stay trusted)
        run: |
          scratch="$(mktemp -d "$HOME/.vm-release-check-XXXXXXXX")"
          chmod 0700 "$scratch"
          echo "TMPDIR=$scratch" >> "$GITHUB_ENV"
      - name: Tests must pass before anything is published
        run: make check VERIFY_FLAGS=--require-systemd-analyze
        env:
          VMHOST_REQUIRE_SYSTEMD_ANALYZE: "1"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
