syntax = "proto3";

package vmlib.facade.v1;

option go_package = "github.com/petruekhin/vibe-firecracker/vmlib/gen/vmlib/facade/v1;facadev1";

// VMService is the lifecycle facade. A call's deadline bounds that call only;
// it never terminates a running VM. Stop and Delete are idempotent.
service VMService {
  rpc CreateVM(CreateVMRequest) returns (VM);
  rpc GetVM(VMRef) returns (VM);
  rpc ListVMs(ListVMsRequest) returns (ListVMsResponse);
  rpc GetSSHInfo(VMRef) returns (SSHInfo);
  rpc StopVM(VMRef) returns (VM);
  rpc CommitVM(CommitVMRequest) returns (Image);
  rpc DeleteVM(VMRef) returns (DeleteVMResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc DeleteImage(DeleteImageRequest) returns (DeleteImageResponse);
  // GetCapabilities returns the backend's resource policy as advertised by the
  // backend. It carries no SSH/bastion metadata (see GetSSHInfo).
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message GetCapabilitiesRequest {}

message CapabilityProfile {
  string name = 1;
  uint32 vcpu = 2;
  uint32 mem_mib = 3;
  uint32 disk_mib = 4;
}

message GetCapabilitiesResponse {
  // Backend VM-count cap (the control API enforces its own quotas separately).
  uint32 max_vms = 1;
  repeated CapabilityProfile profiles = 2;
  // Aggregate admission caps across live VMs; 0 means not enforced.
  uint32 max_total_mem_mib = 3;
  uint32 max_total_vcpu = 4;
}

message CreateVMRequest {
  // Optional caller-chosen ID (same validation as server IDs); generated when empty.
  string vm_id = 1;
  string image_id = 2;
  string profile = 3;
  map<string, string> labels = 4;
  // Optional OpenSSH public key to provision into this VM's disk copy.
  string ssh_public_key = 5;
  // Non-secret client label echoed back in SSHInfo.key_reference.
  string ssh_key_reference = 6;
  VMResources resources = 7;
}

message VMRef {
  string vm_id = 1;
}

message VM {
  string vm_id = 1;
  string image_id = 2;
  string profile = 3;
  // preparing | running | stopping | stopped | committed | deleted | failed
  string state = 4;
  map<string, string> labels = 5;
  bool retained = 6;
  string retained_reason = 7;
  VMResources resources = 8;
}

message ListVMsRequest {}

message ListVMsResponse {
  repeated VM vms = 1;
}

message Bastion {
  string host = 1;
  uint32 port = 2;
  string user = 3;
}

message SSHInfo {
  string host = 1;
  uint32 port = 2;
  string user = 3;
  // client-key-reference | provision-public-key | image-preinstalled
  string auth_mode = 4;
  // A label the CLIENT resolves locally; never a server path or key bytes.
  string key_reference = 5;
  bool public_key_provisioned = 6;
  // pinned | accept-new-per-vm
  string host_key_policy = 7;
  string host_key_fingerprint = 8;
  Bastion bastion = 9;
  bool ready = 10;
  GuestNetwork guest = 11;
}

message GuestNetwork {
  string address = 1;
  string gateway = 2;
  repeated string dns = 3;
  string configuration = 4;
}

message CommitVMRequest {
  string vm_id = 1;
  string new_image_id = 2;
}

message DeleteVMResponse {
  bool deleted = 1;
  bool retained = 2;
  string detail = 3;
}

message VMResources {
  uint32 vcpu = 1;
  uint32 mem_mib = 2;
}

message DeleteImageRequest { string id = 1; }
message DeleteImageResponse {}

message ListImagesRequest {}

message Image {
  string id = 1;
  uint64 size_bytes = 2;
  string sha256 = 3;
  bool base = 4;
}

message ListImagesResponse {
  repeated Image images = 1;
}
