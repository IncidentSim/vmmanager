name: ci

# Root-free checks: no KVM, no privileged commands, no secrets.
on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (race, vet, build, tooling)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fail instead of skipping when systemd cannot verify the rendered units.
      VMHOST_REQUIRE_SYSTEMD_ANALYZE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflows with actionlint (pinned)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: vet, format, race tests, build, staged install round trip
        run: make check VERIFY_FLAGS=--require-systemd-analyze
      - name: API executable smoke (in-memory backend over loopback; not an E2E)
        run: make control-smoke
      - name: legacy builder still builds
        run: make legacy

  release-snapshot:
    name: release snapshot (validate config, build, never publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.1"
          args: check
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "v2.20.1"
          args: release --snapshot --clean --skip=publish
      - name: Exercise the actual host archive without the source tree
        run: |
          mkdir "$RUNNER_TEMP/release-smoke"
          tar -xzf dist/vm-firecracker_*_linux_amd64.tar.gz -C "$RUNNER_TEMP/release-smoke"
          hosts=("$RUNNER_TEMP"/release-smoke/*/vmhost)
          "${hosts[0]}" stage-check
          "${hosts[0]}" verify-units --require-systemd-analyze
